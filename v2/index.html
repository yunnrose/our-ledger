<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8f2"><meta name="description" content="佩筠 × Benson 的共同生活小帳本"><title>佩筠 × Benson 的小帳本♡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head><body><div class="app-shell"><header class="topbar"><div class="brand-mark">♡</div><div class="brand-copy"><h1>佩筠 × Benson 的小帳本♡</h1><p>一起吃飯、一起旅行，也一起記下幸福。</p></div><button class="icon-button" aria-label="設定" id="settingsBtn">⚙</button></header><main><section class="welcome-row"><div><span class="eyebrow">OUR LITTLE MOMENTS</span><h2>今天也一起好好生活。</h2></div><span class="date-pill" id="todayLabel"></span></section><section class="balance-card"><div class="card-kicker">兩人的累計結算</div><div class="balance-value" id="balanceValue">NT$ 0</div><div class="balance-caption" id="balanceCaption">目前帳目已平衡 ♡</div><div class="balance-foot"><span>從新帳本開始記錄</span><span class="sparkle">✦</span></div></section><section class="stats-grid"><article class="stat-card lilac"><span>本月共同支出</span><strong id="monthTotal">NT$ 0</strong><small>這個月一起花費</small></article><article class="stat-card blue"><span>待補紀錄</span><strong id="pendingTotal">0 筆</strong><small>補上金額後納入結算</small></article></section><section class="section-heading"><div><span class="eyebrow">OUR RECORDS</span><h2>最近的日常</h2></div><button class="text-button" id="allRecords">查看全部 →</button></section><section id="recentRecords" class="records empty-state"><div class="empty-heart">♡</div><strong>第一筆共同回憶，從今天開始</strong><p>新增一筆支出，讓你們的小帳本慢慢累積。</p></section></main><nav class="bottom-nav"><button class="nav-item active" data-view="home"><span>⌂</span>首頁</button><button class="nav-item" data-view="records"><span>▤</span>明細</button><button class="add-button" id="addExpense" aria-label="新增支出">＋</button><button class="nav-item" data-view="calendar"><span>▦</span>月曆</button><button class="nav-item" data-view="settlement"><span>♡</span>結算</button></nav></div><dialog id="expenseDialog"><form method="dialog" id="expenseForm"><div class="dialog-head"><div><span class="eyebrow">ADD A MOMENT</span><h2>記下一筆日常</h2></div><button class="close-button" value="cancel" aria-label="關閉">×</button></div><label>項目名稱<input id="expenseTitle" placeholder="例如：晚餐、咖啡、電影" required maxlength="80"></label><label>金額（NT$）<input id="expenseAmount" type="number" min="1" step="1" placeholder="輸入金額；留白可先待補"></label><label>誰先付款？<select id="expensePayer"><option value="peijun">佩筠</option><option value="benson">Benson</option></select></label><label>分帳方式<select id="expenseSplit"><option value="equal">兩人平分</option><option value="peijun">佩筠全額負擔</option><option value="benson">Benson 全額負擔</option></select></label><label>日期<input id="expenseDate" type="date" required></label><label>備註（選填）<textarea id="expenseNote" rows="2" placeholder="想記下的小事…"></textarea></label><button class="primary-button" id="saveExpense" value="default">儲存紀錄</button><p class="form-hint">目前為介面預覽，尚未連接雲端資料庫。</p></form></dialog><script type="module" src="./app.js"></script></body></html>
