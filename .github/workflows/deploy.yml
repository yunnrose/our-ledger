name: Deploy Our Ledger to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test ledger logic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ledger domain tests
        run: node --test tests/ledger-core.test.js

  deploy:
    name: Publish gh-pages branch
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Firebase web config
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
        run: |
          if [ -z "$FIREBASE_CONFIG_JS" ]; then
            echo "Missing repository secret FIREBASE_CONFIG_JS."
            exit 1
          fi
          printf '%s\n' "$FIREBASE_CONFIG_JS" > js/firebase-config.js
          # Normalize the Firebase Console snippet to the named export used by app.js.
          if grep -qE '^[[:space:]]*export[[:space:]]+const[[:space:]]+firebaseConfig[[:space:]]*=' js/firebase-config.js; then
            :
          elif grep -qE '^[[:space:]]*const[[:space:]]+firebaseConfig[[:space:]]*=' js/firebase-config.js; then
            sed -i -E 's/^[[:space:]]*const[[:space:]]+firebaseConfig[[:space:]]*=/export const firebaseConfig =/' js/firebase-config.js
          else
            echo "Firebase config must declare firebaseConfig as a const export or plain const."
            exit 1
          fi
          node --check js/firebase-config.js

      - name: Publish static site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          exclude_assets: '.github,tests,docs,README.md,.gitignore,database.rules.example.json'
