<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>記帳本｜佩筠 × Benson 共同記帳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入獨立的 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <!-- 頂部標題 -->
    <header class="header">
        <h1>📒 佩筠 × Benson 的小帳本</h1>
        <div id="syncStatus" class="sync-badge">
            <span class="sync-dot"></span> <span>連線中…</span>
        </div>
    </header>

    <!-- 結算總覽卡片 -->
    <section class="summary-card">
        <div id="settlementText" class="summary-label">計算中...</div>
        <div id="settlementAmount" class="summary-amount">NT$ 0</div>
        <div class="summary-actions">
            <button class="btn btn-primary" onclick="openTxModal()">
                <i class="fa-solid fa-plus"></i> 記一筆
            </button>
            <button class="btn btn-settle" onclick="openSettleModal()">
                <i class="fa-solid fa-handshake"></i> 還款結清
            </button>
        </div>
    </section>

    <!-- 目前操作者切換 -->
    <div class="user-switcher">
        <span><i class="fa-solid fa-user-pen"></i> 目前操作人：</span>
        <div class="user-pills">
            <button class="user-pill active" data-user="Benson" onclick="setOperator('Benson')">Benson</button>
            <button class="user-pill" data-user="佩筠" onclick="setOperator('佩筠')">佩筠</button>
        </div>
    </div>

    <!-- 分類檢視分頁 -->
    <div class="tabs">
        <button class="tab active" data-tab="all" onclick="switchTab('all')">全部明細</button>
        <button class="tab" data-tab="pending" onclick="switchTab('pending')">
            待補金額 <span id="pendingCount" class="badge-count" style="display:none;">0</span>
        </button>
        <button class="tab" data-tab="logs" onclick="switchTab('logs')">修改紀錄</button>
    </div>

    <!-- 列表呈現區 -->
    <main id="contentList" class="tx-list">
        <div class="empty-state">正在從雲端載入帳本資料...</div>
    </main>
</div>

<!-- 新增 / 編輯帳目 Modal -->
<div id="txModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle" class="modal-title">新增一筆消費</h3>
            <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="txForm" onsubmit="saveTransaction(event)">
            <input type="hidden" id="editTxId">
            
            <div class="form-group">
                <label class="form-label">項目名稱</label>
                <input type="text" id="txItem" class="form-input" placeholder="例如：晚餐拉麵、Costco、早餐" required>
            </div>

            <div class="form-group">
                <label class="form-label">金額 (NT$)</label>
                <input type="number" id="txAmount" class="form-input" step="0.5" min="0" placeholder="輸入金額">
                <label class="checkbox-row">
                    <input type="checkbox" id="txPending" onchange="togglePendingInput()"> 金額待補（先記項目，之後再補金額）
                </label>
            </div>

            <div class="form-group">
                <label class="form-label">誰先付錢？</label>
                <div class="radio-group" id="payerGroup">
                    <div class="radio-btn selected" data-val="Benson" onclick="selectRadio('payerGroup', 'Benson')">Benson 付</div>
                    <div class="radio-btn" data-val="佩筠" onclick="selectRadio('payerGroup', '佩筠')">佩筠 付</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">分帳方式</label>
                <div class="radio-group" id="splitGroup">
                    <div class="radio-btn selected" data-val="split" onclick="selectRadio('splitGroup', 'split')">兩人平分 (50/50)</div>
                    <div class="radio-btn" data-val="advance" onclick="selectRadio('splitGroup', 'advance')">對方全額負擔 (代墊)</div>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">消費日期</label>
                    <input type="date" id="txDate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">分類標籤</label>
                    <select id="txCategory" class="form-select">
                        <option value="餐飲">🍽️ 餐飲</option>
                        <option value="日用品">🛒 日用品</option>
                        <option value="娛樂">🎬 娛樂</option>
                        <option value="交通">🚗 交通</option>
                        <option value="其他">📦 其他</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full">儲存帳目</button>
        </form>
    </div>
</div>

<!-- 還款 Modal -->
<div id="settleModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">記錄一筆還款</h3>
            <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="saveSettlement(event)">
            <div class="form-group">
                <label class="form-label">還款方向</label>
                <div class="radio-group" id="settleDirGroup">
                    <div class="radio-btn selected" data-val="佩筠->Benson" onclick="selectRadio('settleDirGroup', '佩筠->Benson')">佩筠 還給 Benson</div>
                    <div class="radio-btn" data-val="Benson->佩筠" onclick="selectRadio('settleDirGroup', 'Benson->佩筠')">Benson 還給 佩筠</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">還款金額 (NT$)</label>
                <input type="number" id="settleAmount" class="form-input" step="0.5" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-success">確認還款並入帳</button>
        </form>
    </div>
</div>

<!-- 引入獨立的 JavaScript 程式邏輯 -->
<script type="module" src="app.js"></script>
</body>
</html>
