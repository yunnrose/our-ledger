<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>佩筠 × Benson 的記帳聊天室 💬</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 加上 ?v=2 強制瀏覽器讀取最新 CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<section id="authScreen" class="auth-screen">
  <form id="loginForm" class="auth-card">
    <div class="auth-mark">💕</div>
    <h1>佩筠 × Benson</h1>
    <p>請使用自己的帳號登入共享帳本</p>
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPassword">密碼</label>
    <input id="loginPassword" type="password" autocomplete="current-password" required>
    <button id="loginSubmit" type="submit">登入聊天室</button>
    <p id="authError" role="alert" class="auth-error"></p>
  </form>
</section>

<div class="chat-app" id="chatApp" hidden>
    <!-- 頂部固定導覽與結算膠囊 -->
    <header class="chat-header">
        <div class="header-top">
            <div class="room-title">
                <div class="room-avatars">
                    <img src="benson.png" alt="Benson" onerror="this.style.display='none'">
                    <img src="peiyun.jpg" alt="佩筠" onerror="this.style.display='none'">
                </div>
                <div>
                    <h1>佩筠 × Benson 💕</h1>
                    <div id="syncStatus" class="sync-text">連線中…</div>
                </div>
            </div>
            <!-- 切換目前是誰在傳訊息 -->
            <div class="account-tools">
                <span id="currentIdentity">已登入</span>
                <button id="logoutBtn" type="button">登出</button>
            </div>
        </div>

        <!-- 置頂結算橫幅 -->
        <div class="balance-banner">
            <div class="balance-info">
                <span id="settlementText">計算中...</span>
                <strong id="settlementAmount">NT$ 0</strong>
            </div>
            <div class="banner-actions">
                <button class="mini-btn pending-filter" id="pendingFilterBtn" onclick="togglePendingFilter()">
                    待補 <span id="pendingCount">0</span>
                </button>
                <button class="mini-btn log-btn" onclick="openLogsModal()" title="修改紀錄">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </button>
                <button class="mini-btn settle-btn" onclick="openSettleModal()">
                    💸 還款
                </button>
            </div>
        </div>
    </header>

    <!-- 中間聊天氣泡滾動區 -->
    <main id="chatStream" class="chat-stream">
        <div class="empty-chat">正在載入你們的記帳對話... 🐻🐰</div>
    </main>

    <!-- 底部聊天輸入列（快速記一筆） -->
    <footer class="chat-composer">
        <div class="composer-chips">
            <div class="chip-group">
                <button type="button" class="chip active" data-payer="Benson" onclick="setQuickPayer('Benson')">💙 Benson 付</button>
                <button type="button" class="chip" data-payer="佩筠" onclick="setQuickPayer('佩筠')">💜 佩筠 付</button>
            </div>
            <div class="chip-group">
                <button type="button" class="chip active" data-split="split" onclick="setQuickSplit('split')">平分</button>
                <button type="button" class="chip" data-split="advance" onclick="setQuickSplit('advance')">對方負擔</button>
                <button type="button" class="chip pending-chip" id="quickPendingChip" onclick="toggleQuickPending()">待補</button>
            </div>
        </div>

        <form class="composer-input-row" onsubmit="sendQuickTx(event)">
            <select id="quickCategory" class="cat-select" title="分類">
                <option value="餐飲">🍽️</option>
                <option value="日用品">🛒</option>
                <option value="娛樂">🎬</option>
                <option value="交通">🚗</option>
                <option value="其他">📦</option>
            </select>
            <input type="text" id="quickItem" class="chat-input item-input" placeholder="買了什麼？(如:晚餐)" required>
            <input type="number" id="quickAmount" class="chat-input amt-input" step="0.5" min="0" placeholder="$ 金額">
            <button type="submit" class="send-btn" title="傳送記帳">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </footer>
</div>

<!-- 修改 / 補金額 彈窗 -->
<div id="editModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h3 id="editModalTitle" class="modal-title">修改這筆對話</h3>
            <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="saveEditedTx(event)">
            <input type="hidden" id="editTxId">
            <div class="form-group">
                <label class="form-label">項目名稱</label>
                <input type="text" id="editItem" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">金額 (NT$)</label>
                <input type="number" id="editAmount" class="form-input" step="0.5" min="0">
                <label class="checkbox-row">
                    <input type="checkbox" id="editPending" onchange="toggleEditPending()"> 金額待補
                </label>
            </div>
            <div class="form-group">
                <label class="form-label">誰先付錢？</label>
                <div class="radio-group" id="editPayerGroup">
                    <div class="radio-btn" data-val="Benson" onclick="selectRadio('editPayerGroup', 'Benson')">💙 Benson 付</div>
                    <div class="radio-btn" data-val="佩筠" onclick="selectRadio('editPayerGroup', '佩筠')">💜 佩筠 付</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">分帳方式</label>
                <div class="radio-group" id="editSplitGroup">
                    <div class="radio-btn" data-val="split" onclick="selectRadio('editSplitGroup', 'split')">兩人平分</div>
                    <div class="radio-btn" data-val="advance" onclick="selectRadio('editSplitGroup', 'advance')">對方全額負擔</div>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">日期</label>
                    <input type="date" id="editDate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">分類</label>
                    <select id="editCategory" class="form-select">
                        <option value="餐飲">🍽️ 餐飲</option>
                        <option value="日用品">🛒 日用品</option>
                        <option value="娛樂">🎬 娛樂</option>
                        <option value="交通">🚗 交通</option>
                        <option value="其他">📦 其他</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit">儲存修改</button>
        </form>
    </div>
</div>

<!-- 還款彈窗 -->
<div id="settleModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">💸 記錄一筆還款</h3>
            <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form onsubmit="saveSettlement(event)">
            <div class="form-group">
                <label class="form-label">誰還錢給誰？</label>
                <div class="radio-group" id="settleDirGroup">
                    <div class="radio-btn selected" data-val="佩筠->Benson" onclick="selectRadio('settleDirGroup', '佩筠->Benson')">佩筠 還給 Benson</div>
                    <div class="radio-btn" data-val="Benson->佩筠" onclick="selectRadio('settleDirGroup', 'Benson->佩筠')">Benson 還給 佩筠</div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">還款金額 (NT$)</label>
                <input type="number" id="settleAmount" class="form-input" step="0.5" min="1" required>
            </div>
            <button type="submit" class="btn-submit btn-green">送出還款訊息</button>
        </form>
    </div>
</div>

<!-- 修改歷史紀錄彈窗 -->
<div id="logsModal" class="modal-backdrop">
    <div class="modal" style="max-height: 75vh; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h3 class="modal-title">📜 帳本修改歷史</h3>
            <button class="close-btn" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="logsList" style="overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
</div>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
